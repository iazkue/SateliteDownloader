plugins {
    id 'java'
    id 'application'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

application {
    mainClass = 'tfg.satelitedownloader.SateliteDownloaderApplication'
}

group = 'tfg.satelitedownloader'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation platform('io.dropwizard:dropwizard-bom:5.0.0')
    implementation 'io.dropwizard:dropwizard-core:5.0.0'
    implementation 'io.dropwizard:dropwizard-assets:5.0.0'
    implementation 'io.dropwizard:dropwizard-hibernate:5.0.0'
    implementation 'com.h2database:h2:2.2.224'
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.15.2'
    testImplementation 'org.mockito:mockito-core:5.11.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.11.0'
    testImplementation 'io.dropwizard:dropwizard-testing:5.0.0'
}

run {
    args = ['server', 'config.yml']
}

test {
    useJUnitPlatform()
}