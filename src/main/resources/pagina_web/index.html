<!DOCTYPE html>
<html lang="en">

<head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8">

    <head>

        <title>Satellite downloader</title>

        <meta name="viewport" content="width=device-width, initial-scale=1">

        <link rel="stylesheet" href="css/styles.css">
        <link rel="stylesheet" href="css/slideContainer.css">
        <link rel="stylesheet" href="css/login.css">
        <!-- COMENTAR ESTO PARA QUITAR BOOTSTRAP -->
        <link rel="stylesheet" href="css/bootstrap.min.css">

        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css"
            integrity="sha512-xodZBNTC5n17Xt2atTPuE1HxjVMSvLVW9ocqUKLsCC5CXdbqCmblAshOMAS6/keqq/sMZMZ19scR4PsZChSR7A=="
            crossorigin="" />
        <link href='https://api.mapbox.com/mapbox.js/v3.3.1/mapbox.css' rel='stylesheet' />
        <link href='https://api.mapbox.com/mapbox.js/plugins/leaflet-draw/v0.4.10/leaflet.draw.css' rel='stylesheet' />

        <!-- SCRIT IMPORTS -->
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
        <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"
            integrity="sha512-XQoYMqMTK8LvdxXYG3nZ448hOEQiglfqkJs1NOQV44cWnUrBc8PkAOcXy20w0vlaXaVUearIOBhiXZ5V3ynxwA=="
            crossorigin=""></script>

        <script src='https://api.mapbox.com/mapbox.js/v3.3.1/mapbox.js'></script>
        <script src='https://api.mapbox.com/mapbox.js/plugins/leaflet-draw/v0.4.10/leaflet.draw.js'></script>
        <script src='https://api.mapbox.com/mapbox.js/plugins/leaflet-geodesy/v0.1.0/leaflet-geodesy.js'></script>

        <script
            src='https://api.tiles.mapbox.com/mapbox.js/plugins/leaflet-omnivore/v0.3.1/leaflet-omnivore.min.js'></script>

    </head>

<body>

    <div id="map-container">
        <!--div class="container-fluid"-->
        <div class="row m-0">
            <div class="col-9 p-0">
                <div id="map"></div>
            </div>
            <div class="col-3 p-3 pl-0  bg-light">
                <h2>Enter Search Parameters</h2>
                <br>
                <!-- Aqui definimos el endpoint del api al que se va a connectar, modifica action por el endpoint adecuado -->
                <form id="parameters" method="post" action="/downloadImages">
                    <fieldset class="border p-2">
                        <legend class="float-none w-auto p-2 h4">Region of interest</legend>
                        <ul class="nav nav-tabs" id="myTab" role="tablist">
                            <li class="nav-item" role="presentation">
                                <button class="nav-link active" id="home-tab" data-bs-toggle="tab"
                                    data-bs-target="#home" type="button" role="tab" aria-controls="home"
                                    aria-selected="true">Manual
                                </button>
                            </li>
                            <li class="nav-item" role="presentation">
                                <button class="nav-link" id="profile-tab" data-bs-toggle="tab" data-bs-target="#profile"
                                    type="button" role="tab" aria-controls="profile" aria-selected="false">
                                    Predefined
                                </button>
                            </li>
                        </ul>
                        <div class="tab-content" id="myTabContent">
                            <div class="tab-pane fade show active" id="home" role="tabpanel" aria-labelledby="home-tab">
                                <br>
                                <p> Please, select the region of interest by using the buttons on the left of the
                                    map</p>
                            </div>
                            <div class="tab-pane fade" id="profile" role="tabpanel" aria-labelledby="profile-tab">
                                <br>
                                <p>Choose a province from the list:</p>
                                <select class="form-select form-select-sm" id="provinces">
                                    <option selected id="none" value="none"> -- none --</option>
                                    <option id='sh-navarre' value="navarre">Navarra</option>
                                    <option id='sh-euskadi' value="basque">País Vasco</option>
                                    <option id='sh-rioja' value="la_rioja">La Rioja</option>
                                    <option id='sh-aragon' value="aragon">Aragón</option>
                                    <option id='sh-madrid' value="madrid">Madrid</option>
                                </select>
                            </div>
                            <div class="tab-pane fade" id="contact" role="tabpanel" aria-labelledby="contact-tab">...
                            </div>
                        </div>

                    </fieldset>
                    <br>
                    <fieldset class="border p-2">
                        <legend class="float-none w-auto p-2 h4">Select date range</legend>
                        <ol>
                            <label for="iday">Select initial date:</label>
                            <input id="iday" name="iday" class="form-control form-select-sm" type="date">
                            <label for="fday">Select final date:</label>
                            <input type="date" id="fday" name="fday" class="form-control  form-select-sm">
                        </ol>
                    </fieldset>
                    <br>
                    <br>
                    <br>
                    <div class="row justify-content-center">
                        <div class="d-grid gap-2 col-6 mx-auto">
                            <button type="button" class="btn btn-outline-primary" id="preview-btn"
                                disabled>Preview</button>
                        </div>
                    </div>
                    <br>
                    <div class="row justify-content-center">
                        <div id="preview-container" class="col-12"
                            style="display:none; max-height: 400px; overflow-y: auto; text-align: center;">
                            <!-- Previews injected here -->
                        </div>
                    </div>
                    <div class="row justify-content-center">
                        <div class="d-grid gap-2 col-6 mx-auto">
                            <button type="button" class="btn btn-outline-success" id="post-btn"
                                disabled>Download</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="js/script.js"></script>
    <script src="js/leaflet.shpfile.js"></script>
    <script src="js/togeojson.js"></script>
    <!-- COMENTAR ESTO PARA QUITAR BOOTSTRAP -->
    <script src="js/bootstrap.min.js"></script>
    <script src="js/bootstrap.bundle.js"></script>
</body>

</html>
